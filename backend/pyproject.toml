[project]
name = "rhr-backend"
version = "0.1.1"
description = "Raptor HR - Enterprise HR Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.4,<6.1",
    "djangorestframework>=3.17.1,<4.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0",
    "django-allauth>=65.15.1,<66.0",
    "django-cors-headers>=4.9.0,<5.0",
    "django-filter>=25.2,<26.0",
    "drf-spectacular>=0.29.0,<1.0",
    "psycopg[binary]>=3.3.3,<4.0",
    "celery>=5.6.3,<6.0",
    "redis>=7.4.0,<8.0",
    "gunicorn>=25.3.0,<26.0",
    "python-decouple>=3.8,<4.0",
    "dj-database-url>=3.1.2,<4.0",
    "whitenoise>=6.12.0,<7.0",
    "requests>=2.33.1,<3.0",
    "cryptography>=46.0.7,<47.0",
    "pyjwt>=2.12.1,<3.0",
    "pillow>=12.2.0,<13.0",
    "google-auth>=2.49.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.12.0,<5.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-benchmark>=5.2.3,<6.0",
    "factory-boy>=3.3.3,<4.0",
    "ruff>=0.15.10,<1.0",
    "mypy>=1.20.1,<2.0",
    "django-stubs>=6.0.2,<7.0",
    "djangorestframework-stubs>=3.16.9,<4.0",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports and relaxed rules in test files
"**/tests/*.py" = ["F401", "F841", "I001", "B017"]
"**/test_*.py" = ["F401", "F841", "I001", "B017"]
# Allow unused imports in migrations
"**/migrations/*.py" = ["F401", "E501"]
# Allow unused imports in serializers (type hints)
"**/serializers.py" = ["F401", "SIM102", "F811"]
# Allow unused imports in views
"**/views.py" = ["F401"]
# Allow unused imports in middleware
"**/middleware.py" = ["F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Note: strict mode disabled - codebase was not built with full type annotations
# Enable gradually as type annotations are added
ignore_missing_imports = true
warn_unused_ignores = true
# Disable checks that fail on existing code
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false

[tool.django-stubs]
django_settings_module = "config.settings.local"
